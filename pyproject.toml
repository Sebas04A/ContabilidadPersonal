[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contabilidad-personal"
version = "0.1.0"
description = "Sistema de Contabilidad Personal"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["contabilidad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
